# PES M – Regeln der nationalen Pokale (Saison 2025/26)
# Fabian darf alles ändern. sicher = false heißt: nicht Satz für Satz an einer Quelle geprüft, "änderbar".
# Stand 2026-11-24. Quellen: Wikipedia-Saisonartikel 2025–26 je Pokal, Verbandsseiten (thefa.com, dfb.de, rfef.es,
# fff.fr, knvb.nl, fpf.pt, tff.org, scottishfa.co.uk), siehe quellen = … am Pokal.
#
# Felder:
#   teilnehmer_echt  = wie viele Vereine im echten Wettbewerb mitmachen (inkl. Qualifikation)
#   einstieg         = welche Liga-Stufe in welcher Runde einsteigt; runde zählt ab 1 (= erste Hauptrunde in PES M)
#   amateure         = Vereine unterhalb der Ligen, die es in der Welt gibt (Nicht-Liga, Landespokalsieger …)
#   zweite_mannschaften = dürfen B-Teams/U23 mitspielen?
#   unentschieden    = "verlaengerung_elfmeter" | "elfmeter" (sofort, ohne Verlängerung) | "wiederholung"
#   heimrecht        = "auslosung" | "unterklassig" (der Verein aus der tieferen Liga hat Heimrecht)
#   halbfinale       = "einzelspiel" | "hin_rueck"
#   europa           = steht in ligaregeln.toml ([land.europa], "pokal"); hier nur zur Kontrolle
#   ablauf           = was PES M spielt: Runden in Reihenfolge; neu = wer in dieser Runde einsteigt:
#                      "stufe:N" alle Erstteams der Stufe N (fehlt die Liga in der Welt: Amateurvereine dieser Stufe aus amateure.toml),
#                      "stufe:N:K" die K stärksten, "stufe:N:-K" die K schwächsten, "stufe:N:rest" die übrigen,
#                      "stufe:N:europa" / "stufe:N:ohne_europa" mit / ohne Europapokal, "beste:K" die K stärksten des Landes,
#                      "ab:N:K" K zufällige Amateurvereine ab Stufe N, "landespokal:K:p" K Landespokalsieger (Anteil p Drittligisten, sonst Amateure).
#                      quali = nur Amateure, wird nebenbei berechnet; hin_rueck; elfmeter = ohne Verlängerung; tiefste = Neueinsteiger
#                      gegen die tiefsten Vereine; gruppen/spiele = Gruppenphase; toepfe = obere Hälfte gegen untere Hälfte gelost. Ungerade Zahl: der Stärkste hat ein Freilos; nach dem
#                      letzten Einstieg Freilose bis zur Zweierpotenz.
#   welt             = was die FL-Welt (_FL26-27-Def, Megapack und MyWorld gleich) an Vereinen hat
#   vorschlag        = wie PES M das Feld füllt, solange Vereine fehlen

[standard]
unentschieden = "verlaengerung_elfmeter"
heimrecht = "auslosung"
halbfinale = "einzelspiel"
finale = "neutral"
zweite_mannschaften = false
freilose = "staerkste"          # nur wenn das Feld keine Zweierpotenz ist
alle_ligen_des_landes = true     # alle Erstteams aller Ligen des Landes spielen mit (nicht nur die Datenbank-Liste)
hinweis = "Ohne eigenen Eintrag: alle Erstteams des Landes, Einzelspiele mit Verlängerung und Elfmeterschießen, Finale auf neutralem Platz."

