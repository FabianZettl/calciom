# PES M – Ligaregeln aller Länder (Saison 2025/26)
# Maschinenlesbar (TOML). Fabian darf alles ändern und ergänzen.
# Zuordnung: zuerst [[land]] über pes_land (= country=… in fl26world.txt), dann [[land.liga]] über stufe (= tier=…).
# Für Grundligen ohne league-Zeile (z. B. Premier League, LaLiga) zusätzlich über schluessel (Competition.bin, z. B. ENGLAND_D1_LEAGUE).
# sicher = false heißt: Wert ist geschätzt (aus Wissen, nicht Satz für Satz an einer Quelle geprüft).
# Plätze: Zahl = Tabellenplatz, "pokal" = nationaler Pokalsieger, "ligapokal" = Ligapokalsieger.

[meta]
version = 1
saison = "2025/26"
stand = "2026-11-21"
hinweis_kalenderjahr = "Ligen mit Kalenderjahr-Saison (Südamerika, Skandinavien, Asien teilweise) nutzen die Regeln der Saison, die in 2025/26 läuft (meist 2025 oder 2026)."
quellen = ["https://en.wikipedia.org/wiki/2025%E2%80%9326_UEFA_Champions_League#Association_team_allocation", "https://en.wikipedia.org/wiki/2025%E2%80%9326_UEFA_Europa_League", "https://en.wikipedia.org/wiki/2025%E2%80%9326_UEFA_Conference_League", "Wikipedia-Saisonartikel je Liga (siehe quelle = … an der Liga)", "FL-Welten _FL26-27-Def, _FL26Megapack, _FL26MyWorld (fl26world.txt: league, poff, split) für Ligagrößen und Länder-Nummern"]

# Gilt für jede Liga ohne eigenen Eintrag und für fehlende Felder.
[standard]
absteiger_nach_vereinen = [{ ab_vereine = 18, absteiger = 3 }, { ab_vereine = 14, absteiger = 2 }, { ab_vereine = 0, absteiger = 1 }]
aufsteiger_gleich_absteiger_darueber = true
unterste_stufe_absteiger = 0
runden = 2
punkte_sieg = 3
punkte_remis = 1
tabelle_reihenfolge = ["punkte", "tordifferenz", "tore", "direkter_vergleich"]
kontinental_meister = true
kontinental_pokalsieger = true
hinweis = "Ohne Eintrag: Absteiger nach Ligagröße, gleich viele Aufsteiger aus der Liga darunter, Doppelrunde, keine Play-offs. Meister spielt im Kontinentalwettbewerb seines Verbands, Pokalsieger im zweiten Wettbewerb."

# Zweite Mannschaften (B-Teams, U21/U23, Jong …). Diese Regeln gelten IMMER, auch wenn das Land unten mehr erlaubt.
[standard.zweite_mannschaften]
erlaubt = true
hoechste_stufe = 3
nie_gleiche_liga_wie_erste = true
nie_hoeher_als_erste = true
bei_verbotenem_aufstieg = "naechster_rueckt_nach"
bei_abstieg_der_ersten = "zweite_steigt_mit_ab_falls_gleiche_liga"
kontinental_erlaubt = false
pokal_erlaubt = false
erkennung = ["II", " B", "U21", "U23", "Jong ", "Castilla", "Atlètic", "Next Gen", "Futuro", "Amateure", "Reserves", "Liefering"]
hinweis = "Eine zweite Mannschaft darf nie in die Liga der ersten Mannschaft (oder höher) aufsteigen; der Nächstplatzierte rückt nach. Erkennung über Namensteile oder über eine Liste in der Karriere."

# Kontinentale Wettbewerbe: Kürzel, die unten unter europa/kontinental benutzt werden.
[wettbewerbe]
cl = "UEFA Champions League"
el = "UEFA Europa League"
uecl = "UEFA Conference League"
libertadores = "CONMEBOL Libertadores"
sudamericana = "CONMEBOL Sudamericana"
concacaf_champions_cup = "CONCACAF Champions Cup"
concacaf_central_american_cup = "Copa Centroamericana (Weg in den Champions Cup)"
