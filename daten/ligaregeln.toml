afc_champions_league_two = "AFC Champions League Two"
afc_challenge_league = "AFC Challenge League"
caf_champions_league = "CAF Champions League"
caf_confederation_cup = "CAF Confederation Cup"
ofc_champions_league = "OFC Champions League"

[uefa]
rangliste = "UEFA-Verbandskoeffizient 2024 (gilt für 2025/26)"
quelle = "https://en.wikipedia.org/wiki/2025%E2%80%9326_UEFA_Champions_League#Association_team_allocation"
leistungsplaetze_eps = 2
eps_hinweis = "Die zwei Verbände mit dem besten Koeffizienten der Vorsaison bekommen je einen zusätzlichen CL-Platz (nächster Ligaplatz). 2025/26: England und Spanien. PES M soll das ab der 2. Saison selbst aus den simulierten Europapokal-Ergebnissen berechnen."
weitergabe = "Hat sich der Pokalsieger schon über die Liga qualifiziert, geht sein Platz an den nächsten Ligaplatz, der noch nicht qualifiziert ist."
titelverteidiger = "Sieger von CL und EL sind für die CL-Ligaphase gesetzt; der UECL-Sieger für die EL-Ligaphase. Ist er schon qualifiziert, rückt ein Platz im Zugangsschema nach."
genauigkeit = "Welche Plätze in welchen Wettbewerb gehen, folgt dem UEFA-Zugangsschema 2025/26. Die Einstiegsrunde (phase) ist für Ränge ab 8 teilweise geschätzt."
