# Saisonthemen der Tagesphasen (Startwerte, nicht kalibriert): Ereignisse, die OHNE Spielverlauf tragen (frische Karriere, Vorbereitung, spielfreie Tage).
# Sie füllen eine Phase bis `min` (tagesphase.toml) auf, wenn die Pool-Themen (Auslöser aus Siegen, Niederlagen, Moral, Form ...) nicht genug liefern.
# `braucht` = Felder des Kontexts (`pesm/backend/saison.py`), die da sein müssen, sonst gibt es das Thema nicht (nie ein Platzhalter im Text).
# `sperre` (Standard unten) = Tage, die dasselbe Thema ruhen soll; reicht der Vorrat sonst nicht, kommt das am längsten ruhende Thema trotzdem (ein Tag bleibt nie leer), nie zweimal am selben Tag.
# Texte: sa.<id>.titel und sa.<id>.text (Platzhalter {verein} {gegner} {wann} ...), Absender: sa.absender.<absender>.
[standard]
sperre = 4

[[thema]]
id = "training_fitness"
phase = "morgen"
absender = "co_trainer"
kategorie = "kader"
braucht = ["n_kader", "ausfall", "spielsatz"]
link = { seite = "vorbereitung", text = "pe.akt.aufstellung" }
