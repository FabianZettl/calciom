# Geografie des Scoutings (Sitzung S). Quelle: docs/intern/GEOGRAFIE.md (Messung 2026-10-15), nur Nummern; Namen stehen nicht im Repo.
# liga_land: nationaler Wettbewerb (Nummer, Stufe 0) → Flaggennummer des Landes (Anteil der Hauptnation ≥ 0,8).
# international: echte internationale Wettbewerbe (Europa-, Südamerika-, Asienpokale, Klub-Weltpokal, internationale Vorbereitungsturniere) – Gebiet „International“.
# Typ geprüft gegen die Spieldaten (Teilnehmer, Art, Größe): Wettbewerb 22 und 28 (nationale Liga und Pokal eines Landes mit vielen Legionären, nur ~50 % einer Nationalität)
# sind national; 106 (internationales Vorbereitungsturnier mit 4 Vereinen) ist international.
# weltregion: Flaggennummer → Weltregion, von PESM gepflegt; nicht verzeichnete Flaggen gelten als „weitere“. Ergänzen, sobald Ländernamen vorliegen.

