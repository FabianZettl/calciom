# Regeln der Wettbewerbe je Spielwelt (hier: SP Football Life 2026, Datenstand 2026). Eigene Festlegung von CalcioM, austauschbar.
# Was der Spielstand trägt, wird beim Einlesen gemessen (WETTBEWERBE.md) und gegen diese Datei abgeglichen; was er nicht trägt, steht hier.
# sicherheit: "bestaetigt" = am Spielstand oder im Spiel belegt, "vermutet" = Regel der Saison 2025/26 aus dem Fußball, im Spiel nicht belegt.
# Plätze der Tabelle: oben als [von, bis] (1 = Meister), unten als Zahl vom Tabellenende her (abstieg = die letzten N, relegation = die N Plätze darüber).
# Ein Platz wird nur gezeigt, wenn es sein Ziel in dieser Spielwelt gibt: Europapokal-Wettbewerbe stehen unter [europa], Auf- und Abstieg nur mit verknüpfter Liga.

[spielwelt]
kennung = "sp-football-life-2026"
datenstand = "2026"

[europa]                    # Nummern der Ziel-Wettbewerbe (Stufe 0); 0 = diesen Wettbewerb gibt es in der Spielwelt nicht
cl = 3                      # Champions League, Gruppenphase
cl_quali = 2                # Champions League, Qualifikation (Hin- und Rückspiel)
el = 5                      # Europa League
ecl = 0                     # Conference League: kein Wettbewerb im Spielstand
supercup = 7

[[europapokal]]             # Aufbau der Europapokale; die K.-o.-Runden stehen nicht im Spielplan des Spielstands (werden erst im Spiel erzeugt)
nummer = 3                  # Champions League, Gruppenphase
gruppen = 8
weiter_je_gruppe = 2
dritte_nach = "el"          # Gruppendritte wechseln in die Europa League
sicherheit = "vermutet"
quelle = "reglement"

[[europapokal]]
nummer = 4                  # Champions League, K.-o.-Runden
ko = [["achtelfinale", "hin_rueck"], ["viertelfinale", "hin_rueck"], ["halbfinale", "hin_rueck"], ["finale", "einzel"]]
verlaengerung = true
elfmeter = true
sicherheit = "vermutet"
quelle = "reglement"

[[europapokal]]
nummer = 5                  # Europa League, Gruppenphase
gruppen = 12
weiter_je_gruppe = 2
sicherheit = "vermutet"
quelle = "reglement"

[[europapokal]]
nummer = 6                  # Europa League, K.-o.-Runden
ko = [["sechzehntelfinale", "hin_rueck"], ["achtelfinale", "hin_rueck"], ["viertelfinale", "hin_rueck"], ["halbfinale", "hin_rueck"], ["finale", "einzel"]]
verlaengerung = true
elfmeter = true
sicherheit = "vermutet"
quelle = "reglement"

[[europapokal]]
nummer = 2                  # Champions League, Qualifikation: Paarungen mit Hin- und Rückspiel, die Sieger kommen in die Gruppenphase
ziel = 3
sicherheit = "bestaetigt"
quelle = "spielstand"

