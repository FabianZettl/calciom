# Zwischenereignisse: je Gespräch höchstens eines je Kennung, Chance je Runde ab Runde 1.
# wirkung: nachlass (Gegenüber gibt leichter nach), druck (Forderung steigt), stimmung (Punkte), punkt (neuer Verhandlungspunkt)
[[ereignis]]
id = "berater_ruft"
bereiche = ["spieler"]
chance = 0.18
nachlass = -1
stimmung = -4
[[ereignis]]
id = "verein_meldet_sich"
bereiche = ["spieler", "berater"]
chance = 0.14
nachlass = -1
stimmung = -3
[[ereignis]]
id = "presse_wind"
bereiche = ["spieler", "berater", "verein", "vorstand", "fans"]
chance = 0.15
nachlass = 0
stimmung = -5
[[ereignis]]
id = "kollege_vermittelt"
bereiche = ["spieler", "trainer", "jugend"]
chance = 0.12
nachlass = 1
stimmung = 4
[[ereignis]]
id = "angebot_vom_konkurrenten"
bereiche = ["berater", "verein"]
chance = 0.16
nachlass = -1
stimmung = -2
[[ereignis]]
id = "familie_einmischung"
bereiche = ["jugend", "spieler"]
chance = 0.12
nachlass = -1
stimmung = -2
[[ereignis]]
id = "fanmeinung"
bereiche = ["vorstand", "fans", "presse"]
chance = 0.15
nachlass = 0
stimmung = 3
[[ereignis]]
id = "sponsor_hinweis"
bereiche = ["vorstand", "verein"]
chance = 0.12
nachlass = 1
stimmung = 2

