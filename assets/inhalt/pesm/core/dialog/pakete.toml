# Fachliche Pakete der Gesprächsbereiche (Sitzung H3): Themen, Punkte, Anrede und Zwischenereignisse. Der Kern (motor.py) ist für alle gleich.
# Punkt: stufen = Zahl der Zugeständnisstufen (0 = nichts), nachfrage = Spanne der anfänglichen Forderung des Gegenübers (Stufe),
#        zusage = Art des Versprechens, das ein Zugeständnis ab `zusage_ab` bindet (leer = keines).

