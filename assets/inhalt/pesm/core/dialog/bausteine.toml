# Pool der Antwortbausteine (Sitzung H3). Ein Baustein = Absicht + Ton + Bedingungen; der ausformulierte Satz entsteht erst beim Senden
# (Texte `dlg.ich.<id>`). Gruppen für `nach` und `nicht_nach`: POS = zustimmend, begeistert; NEG = ablehnend, verletzt, misstrauisch;
# DRUCK = drohung, ultimatum; FORD = fordernd, gegenangebot; OFFEN = frage, ausweichend.
# Felder: id, absicht, ton, nach (leer = nach allem), nicht_nach, bedingungen, punkt ("*" = ein offener Punkt, "" = keiner),
#         modi (Vorgabe ["dialog"]), s = Faktor auf die Tonwirkung, v = Verhältnis, r = Risiko 0–3, max = Verwendungen je Gespräch (Vorgabe 2).
# Bedingungen: verhaeltnis>=N, verhaeltnis<N, stimmung>=N, stimmung<N, vertrauen>=N, vertrauen<N, runde>=N, stark, schwach, luecke, offen,
#              keine_punkte, zusage_moeglich, wiederholt, frist, budget; "!" davor verneint.

[absicht]
reihenfolge = ["zustimmen", "danken", "loben", "kritisieren", "erklaeren", "ausblick", "nachfragen", "gegenangebot", "kompromiss", "versprechen", "gefuehl", "entschuldigen",
               "beruhigen", "auflockern", "druck", "zeit", "ablehnen", "ablenken", "abschliessen", "abbrechen"]

[gruppen]
POS = ["zustimmend", "begeistert"]
NEG = ["ablehnend", "verletzt", "misstrauisch"]
DRUCK = ["drohung", "ultimatum"]
FORD = ["fordernd", "gegenangebot"]
OFFEN = ["frage", "ausweichend"]

