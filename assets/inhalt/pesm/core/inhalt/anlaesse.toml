# Welche Pool-Themen zu einem Anlass (Katalog der Gespräche, core/gespraeche/themen.toml) passen; das erste, dessen Auslöser im Kontext erfüllt ist, wird genommen.
[anlass]
spielzeit = ["spielzeit_stammkraft", "reservist_unzufrieden"]
rolle = ["spielzeit_stammkraft", "reservist_unzufrieden"]
beschwerde = ["spielzeit_stammkraft", "reservist_unzufrieden"]
formtief = ["fuehrungsspieler_ausser_form", "formtief"]
leistung = ["fuehrungsspieler_ausser_form", "formtief"]
verletzungsangst = ["verletzungsangst_rueckkehr"]
kabinenstreit = ["egoist_auf_der_bank", "kabinenstreit", "kabine_gruppen_alt_jung", "kabine_aussprache_nach_niederlage"]
familie = ["heimweh_familie"]
familie_sensibel = ["heimweh_familie"]
kapitaensbinde = ["kapitaensbinde", "kabine_kapitaen_zerwuerfnis"]
wechselgedanken = ["wechselwunsch_leistungstraeger"]
gehalt = ["gehalt_unter_schnitt"]
auslaufend = ["altstar_karriereende", "vertrag_laeuft_aus"]
vertrag = ["altstar_karriereende", "vertrag_laeuft_aus"]
belastung = ["belastung_muede"]
ehrgeiz = ["ehrgeiz_saisonziel"]
lob = ["torjaeger_im_lauf", "verantwortung_gewuenscht"]
perspektive = ["talent_wartet_auf_einsatz", "reservist_unzufrieden", "jugend_potenzial_zweifel", "mentor_schuetzling_stagniert"]
kritik_nach_ausrutscher = ["kritik_oeffentlich", "social_media_aussage"]

# Jugendausbau: Anlässe der Akademie und der Eltern (core/gespraeche/themen.toml, Gruppe Akademie)
akademie_befoerderung = ["jugend_berater_vertragsforderung", "jugend_potenzial_zweifel"]
eltern_ohne_spielzeit = ["jugend_leihe_angebot", "jugend_eltern_umzug_schule"]
eltern_vertrag = ["jugend_berater_vertragsforderung", "jugend_eltern_umzug_schule"]
presse_abwerbung = ["jugend_talent_geht_verein"]
ziele = ["akademie_saisonbilanz"]
