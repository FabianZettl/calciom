# Inhaltspool Welle J (Verein): Angebot für einen Spieler, Leihanfrage, Tauschvorschlag. Texte: pool_wellen_j.json, pool_b_wellen_j.json, pool_titel_wellen_j.json (de) und en/.

[thema.angebot_fuer_spieler]
