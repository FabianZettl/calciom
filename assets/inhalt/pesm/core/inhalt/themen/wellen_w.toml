[thema.spieler_elfmeter_wunsch]
kategorie = "spieler"
absender = "spieler"
kanal = "persoenlich"
dringlichkeit = 1
sperre_tage = 45
haeufigkeit = 0.4
wenn = ["ego>=0.6", "form>=1"]
eroeffnung = [
  { id = "e1" },
  { id = "e2" },
  { id = "e3" },
  { id = "e4", typ = ["hitzig", "launisch"] },
  { id = "e5", typ = ["loyal", "sensibel"] },
  { id = "e6", typ = ["ehrgeizig", "wechselfreudig"] },
]
antwort = [
  { id = "a1", strategie = "zusage", ton = "bestimmt", wirkungen = [{ ziel = "moral", delta = 5 }, { ziel = "beziehung", delta = 3 }] },
  { id = "a2", strategie = "erklaeren", ton = "sachlich", wirkungen = [{ ziel = "moral", delta = -1 }, { ziel = "beziehung", delta = 2 }] },
