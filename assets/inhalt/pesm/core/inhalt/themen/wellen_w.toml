  { id = "a5", strategie = "einfuehlen", ton = "einfuehlsam", wirkungen = [{ ziel = "moral", delta = 2 }, { ziel = "beziehung", delta = 3 }] },
  { id = "a6", strategie = "delegieren", ton = "sachlich", wirkungen = [{ ziel = "beziehung", delta = 1 }] },
  { id = "a7", strategie = "gegenfrage", ton = "offen", wirkungen = [] },
  { id = "a8", strategie = "hart_bleiben", ton = "bestimmt", wirkungen = [{ ziel = "moral", delta = -3 }, { ziel = "beziehung", delta = -2 }] },
]
reaktion = [
  { id = "r1", gruppe = "gut" },
  { id = "r2", gruppe = "gut", typ = ["ehrgeizig"] },
  { id = "r3", gruppe = "gut", typ = ["loyal", "gelassen"] },
  { id = "r4", gruppe = "neutral" },
  { id = "r5", gruppe = "neutral", typ = ["sensibel", "launisch"] },
