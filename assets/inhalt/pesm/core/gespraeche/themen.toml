# Themenmotor: Anlässe, mit denen Spieler und Leute aus dem Verein auf den Trainer zukommen.
# Je Anlass: bereich (Partner), dialog (Thema des Gesprächsmotors, pakete.toml), quelle (woher die Daten stammen, nur zur Doku),
# wenn (alle Bedingungen), haeufigkeit (Chance je Woche, fest je Woche/Partner), sperre_tage (Pause nach einem Gespräch zum Thema), dringend 1–3.
# Bedingungen: moral<45 | form<=-1 | rest<=12 | alter>=30 | einsatz<0.3 | wechsel>=0.6 | sorge:form | rolle:star,fuehrungsspieler | merkmal:hitzkopf,launisch
#              fuehrung>=0.65 (Charakterwert 0…1) | vorstand<45 | fans<40 | medien<45 | budget<=0 | kader_alt>=0.4 – Zahlen: <, <=, >, >=; ":" = eines aus der Liste.

[[anlass]]
id = "spielzeit"
berechtigung = "spielzeit"
bereich = "spieler"
dialog = "spielzeit"
quelle = "Entwicklung: Moraltreiber Spielzeit"
wenn = ["sorge:spielzeit"]
haeufigkeit = 0.8
sperre_tage = 21
dringend = 1
