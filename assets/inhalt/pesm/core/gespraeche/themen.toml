# Wirkung einer Antwortabsicht nach Persönlichkeit (Punkte auf die Stimmung; Startwert, nicht kalibriert). wenn: Charakterwert (0…1) oder merkmal:<id>
[[absicht_bonus]]
wenn = "ehrgeiz>=0.7"
absichten = ["ausblick", "versprechen"]
wert = 3                      # Ehrgeizige wollen Perspektive
[[absicht_bonus]]
wenn = "loyalitaet>=0.7"
absichten = ["loben", "danken", "gefuehl"]
wert = 3                      # Loyale wollen Wertschätzung
[[absicht_bonus]]
wenn = "merkmal:launisch"
absichten = ["zeit"]
wert = -4                     # Launische nehmen Vertrösten schlecht auf
[[absicht_bonus]]
wenn = "ego>=0.7"
absichten = ["zeit", "ablehnen"]
wert = -2
