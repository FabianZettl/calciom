# Wie Merkmale die Reaktion verändern (nur die, die den Umgang spürbar schwerer oder leichter machen).
# neg / pos = Faktor auf negative / positive Stimmungswirkung, laune = Schwankung je Tag (± Punkte), geduld = Zuschlag auf die Geduld,
# nachtragend = Beziehungsverlust bei schlechtem Ausgang (Faktor), zeile = Chance auf eine Charakterzeile in der Antwort.
[reaktion.hitzkopf]
neg = 1.5
pos = 0.9
laune = 4
geduld = -1
nachtragend = 1.2
zeile = 0.5
[reaktion.launisch]
neg = 1.2
pos = 1.0
laune = 9
geduld = 0
nachtragend = 1.0
zeile = 0.5
[reaktion.sensibel]
neg = 1.4
pos = 1.2
laune = 3
geduld = -1
nachtragend = 1.3
zeile = 0.4
[reaktion.lautsprecher]
neg = 1.2
pos = 0.9
laune = 3
geduld = 0
nachtragend = 1.0
zeile = 0.4
[reaktion.wechselfreudig]
neg = 1.1
pos = 0.8
laune = 2
geduld = -1
nachtragend = 0.8
zeile = 0.5
[reaktion.loyal]
neg = 0.7
pos = 1.2
laune = 1
geduld = 1
nachtragend = 0.6
zeile = 0.4
[reaktion.teamplayer]
neg = 0.8
pos = 1.1
laune = 1
geduld = 1
nachtragend = 0.7
zeile = 0.3
[reaktion.vorbild_profi]
neg = 0.7
pos = 1.1
laune = 0
geduld = 1
nachtragend = 0.6
zeile = 0.3
[reaktion.gelassen]
neg = 0.8
pos = 1.0
laune = 1
geduld = 1
