# Markenwelt: echte Medien-, Portal-, Sender- und Sponsorennamen als Inhalte der Spielwelt (privates Einzelspieler-Spiel, nichts verlässt die App).
# Neue Marke oder Änderung = nur diese Datei. Pflichtfelder: name, kurz, typ, farben (grund, text, akzent), schrift, logo, ton, rubriken, vorlage, gewicht, haltung, ressorts.
# typ: portal | zeitung | magazin | tv | streaming | statistik | sponsor | ausruester | partner
# schrift (lizenzfrei, aus assets/fonts oder System): kondensiert (Barlow Semi Condensed) | grotesk (Inter) | serife (System-Serife)
# logo: Dateiname im Ordner assets/marken/<id>/ (logo.svg oder logo.png), vom Anwender gefüllt; ohne Datei steht die Wortmarke (Text in Markenfarbe und -schrift)
# gewicht: Reichweite 1..100 (wirkt auf Berichte, Rechte, Sponsoren). haltung: Thema -> -2..2 (kritisch .. wohlwollend); haltung_grund: Thema -> Begründung in Fußballsprache.
# textsatz: Satzfamilie der Texte (core/texts/zeitung_artikel.json); blatt: Platz in zeitung.toml. autoren: erfunden (nie echte Personen) oder "Redaktion".
# absender: Anzeigename im Posteingang/Eilmeldung (Feld `absender` der Schnittstelle, siehe docs/intern/MARKEN.md).

[the-athletic]
name = "The Athletic"
kurz = "Athletic"
typ = "zeitung"
farben = { grund = "#121212", text = "#F5F2EA", akzent = "#E8B923" }
schrift = "serife"
logo = "logo.svg"
ton = "analytisch, ausführlich, ruhig; Hintergrund und Taktik vor Aufregung"
rubriken = ["Analyse", "Taktik", "Hintergrund", "Transfers", "Zahlen"]
vorlage = "lang"
gewicht = 80
haltung = { erfolg = 1, krise = 0, geld = 0, jugend = 2, taktik = 2, trainer = 1 }
haltung_grund = { jugend = "Das Blatt sucht in Nachwuchsleistungen die langfristige Linie.", taktik = "Das Blatt erklärt Ergebnisse über Spielanlage und Muster.", erfolg = "Das Blatt würdigt Erfolge, ordnet sie aber taktisch ein." }
ressorts = ["Taktik", "Transfers", "Premier League", "Bundesliga", "Europa"]
autoren = ["Redaktion Taktik", "Jonas Berkenfeld", "Mira Tolstad"]
textsatz = "qualitaet"
blatt = "qualitaet"
laenge = "lang"
absender = "The Athletic"

