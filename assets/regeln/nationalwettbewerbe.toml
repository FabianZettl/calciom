# CalcioM – Länderspielfenster und Nationalteam-Wettbewerbe (Startdaten), Stand 23.11.2026
# Stil wie ligaregeln.toml. Fabian darf alles ändern. sicher = false heißt: geschätzt, bitte prüfen.
# Wettbewerbe wiederholen sich über "rhythmus" (alle n Jahre ab "erstes_jahr"), damit lange Karrieren funktionieren.
# Formate (Baukasten): gruppen_ko, liga, liga_stufen (Nations League), quali_gruppen, ko
# Verbände: UEFA, CONMEBOL, CONCACAF, AFC, CAF, OFC

[meta]
version = 1
stand = "2026-11-23"
quellen = ["FIFA International Match Calendar 2025–2030", "UEFA-Wettbewerbsseiten", "Wikipedia-Artikel je Turnier"]

# ------------------------------------------------------------------ Fenster
[[fenster]]
name = "Herbst"
beginn = "09-21"
tage = 16
spiele = 4
sicher = false
hinweis = "Ab 2026 sind September- und Oktoberfenster zusammengelegt."

[[fenster]]
name = "November"
beginn = "11-09"
tage = 9
spiele = 2
sicher = true

[[fenster]]
name = "März"
beginn = "03-22"
tage = 9
spiele = 2
sicher = true

[[fenster]]
