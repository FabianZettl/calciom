# Eigene Ergänzung: wie stark die Woche die Entwicklung je Fähigkeit lenkt. Ein Wert, den die Woche nicht übt, wächst mit `ungeuebt`,
# einer mit `voll_ab` Planpunkten oder mehr mit `geuebt` (dazwischen linear). Torhüter üben ihre Torwartwerte nur im Torwarttraining.
[wirkung]
ungeuebt = 0.8
geuebt = 1.3
voll_ab = 0.3

# Eigene Ergänzung: der Co-Trainer plant lockerer, wenn die mittlere Fitness des Kaders darunter liegt.
[co]
muede_unter = 78
