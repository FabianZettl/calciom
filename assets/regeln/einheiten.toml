# Trainingseinheiten, Wochenraster und Vorlagen ab Werk. Zahlen sind Stellschrauben; Texte stehen in core/texts/trainingsplan.json (tp.*).
# last = Belastungspunkte einer Einheit bei normaler Intensität und 60 Minuten (wie [belastung.einheiten] im Entwicklungsmodell), moral = Stimmungswirkung je Einheit,
# basis = Punkte je Einheit auf einen Hauptwert eines idealen Spielers (Nebenwerte zählen neben_anteil), art = gruppe | einzel, fokus = Fokusgruppe des Entwicklungsmodells.
[raster]
slots = ["vormittag", "nachmittag", "abend", "einzel"]
tage = 7
dauern = [30, 60, 90]
intensitaeten = { schonend = { last = 0.6, nutzen = 0.7 }, normal = { last = 1.0, nutzen = 1.0 }, hart = { last = 1.4, nutzen = 1.25 } }
spieltag_last = 10.0              # zusätzliche Belastung am Spieltag
wiederholung = 0.85               # jede weitere Einheit derselben Art in der Woche bringt so viel weniger
restwert = 99                     # Werte nahe dem Deckel wachsen kaum noch
trainer_hebel = 0.25              # Trainerqualität 0 / 100 -> Nutzen -25 % / +25 %
neben_anteil = 0.4
spieltag_max_last = 2.0          # am Spieltag erlaubt: Einheiten bis zu dieser Last, nur im ersten Slot
reha_max_last = 0.5               # am Regenerationstag erlaubt: Einheiten bis zu dieser Last

[alter]                           # (bis Alter, Faktor)
stufen = [[19, 1.3], [22, 1.1], [26, 0.85], [29, 0.5], [32, 0.25], [99, 0.1]]

[ampel]
zone = { niedrig = "gruen", normal = "gruen", hoch = "gelb", ueberlastet = "rot" }
risiko_gelb = 2.5                 # Verletzungsrisiko der Woche in Prozent (für einen Durchschnittsspieler)
risiko_rot = 4.0

[einheit]
kopfballpendel = { gruppe = "technik", art = "gruppe", haupt = ["kopfball", "sprungkraft"], neben = ["balance", "koerperkontakt"], last = 3.0, moral = 0.5, basis = 0.10, fokus = "physis" }
freistoesse = { gruppe = "standards", art = "gruppe", haupt = ["freistoss", "effet"], neben = ["schusskraft"], last = 1.5, moral = 1.0, basis = 0.10, fokus = "technik" }
eckenvariationen = { gruppe = "standards", art = "gruppe", haupt = ["steilpass", "kopfball"], neben = ["flachpass"], last = 2.0, moral = 0.5, basis = 0.08, fokus = "technik" }
elfmeterschiessen = { gruppe = "standards", art = "einzel", haupt = ["abschluss", "schusskraft"], neben = ["effet"], last = 1.0, moral = 1.0, basis = 0.09, fokus = "schuss" }
fluegelspiel = { gruppe = "technik", art = "gruppe", haupt = ["flachpass", "steilpass"], neben = ["antritt", "schnelligkeit"], last = 4.0, moral = 0.5, basis = 0.10, fokus = "technik" }
torschuss = { gruppe = "technik", art = "gruppe", haupt = ["schusskraft", "abschluss"], neben = ["effet", "ballkontrolle"], last = 3.0, moral = 1.0, basis = 0.10, fokus = "schuss" }
passspiel = { gruppe = "technik", art = "gruppe", haupt = ["flachpass", "steilpass"], neben = ["ballkontrolle", "enge_ballfuehrung"], last = 2.0, moral = 0.5, basis = 0.10, fokus = "technik" }
dribbling = { gruppe = "technik", art = "einzel", haupt = ["dribbling", "enge_ballfuehrung"], neben = ["balance", "antritt"], last = 3.0, moral = 0.5, basis = 0.10, fokus = "technik" }
zweikampf = { gruppe = "defensive", art = "gruppe", haupt = ["koerperkontakt", "balleroberung"], neben = ["aggressivitaet", "balance"], last = 6.0, moral = 0.0, basis = 0.10, fokus = "defensiv" }
defensivarbeit = { gruppe = "defensive", art = "gruppe", haupt = ["defensivgeist", "balleroberung"], neben = ["klaeren", "aggressivitaet"], last = 4.0, moral = 0.0, basis = 0.09, fokus = "defensiv" }
ausdauerlauf = { gruppe = "athletik", art = "gruppe", haupt = ["ausdauer"], neben = ["balance"], last = 8.0, moral = -1.0, basis = 0.14, fokus = "physis" }
schnelligkeit = { gruppe = "athletik", art = "gruppe", haupt = ["schnelligkeit", "antritt"], neben = ["sprungkraft"], last = 7.0, moral = -0.5, basis = 0.10, fokus = "tempo" }
torwarttraining = { gruppe = "torwart", art = "gruppe", haupt = ["fangen", "reflexe", "reichweite"], neben = ["klaeren", "torwartgefuehl"], last = 4.0, moral = 0.5, basis = 0.10, fokus = "torwart" }
spielaufbau = { gruppe = "taktik", art = "gruppe", haupt = ["offensivgeist", "flachpass", "ballkontrolle"], neben = ["steilpass"], last = 3.0, moral = 0.5, basis = 0.08, fokus = "technik" }
taktikschulung = { gruppe = "taktik", art = "gruppe", haupt = ["defensivgeist", "offensivgeist"], neben = [], last = 1.5, moral = 0.5, basis = 0.08, fokus = "" }
spezialtraining = { gruppe = "spezial", art = "einzel", haupt = [], neben = [], last = 3.0, moral = 0.5, basis = 0.0, fokus = "" }   # zielt auf eine Spezialfähigkeit (Fortschrittsweg), Wirkung über den Weg
regeneration = { gruppe = "erholung", art = "gruppe", haupt = [], neben = [], last = -1.5, moral = 1.0, basis = 0.0, fokus = "" }
umschulung = { gruppe = "umschulung", art = "einzel", haupt = [], neben = [], last = 2.0, moral = 0.0, basis = 0.0, fokus = "" }   # Trainingsblock: Spieler auf eine neue Position schulen (Zielposition und Wochen in der Zelle)
reha = { gruppe = "erholung", art = "einzel", haupt = [], neben = [], last = 0.0, moral = 0.0, basis = 0.0, fokus = "" }

