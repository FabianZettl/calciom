# Eigene Ergänzung (Rust-Neubau, Fabian 23.11.): weitere Gruppeneinheiten mit klarem Schwerpunkt.
[einheit.stellungsspiel]
gruppe = "defensive"
art = "gruppe"
haupt = ["defensivgeist", "balleroberung"]
neben = ["aggressivitaet", "antritt"]
last = 3.0
