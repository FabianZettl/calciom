# League awards (Fabian 24.11.): every league has its own awards, given at the end of the season.
# art: spieler (player of the season), tore (top scorer), jung (best young player up to `alter`),
#      torwart (best keeper), trainer (coach of the season)
# name: the real award's name (a proper noun, not translated); without it the generic text ui.ligapreis.<art> is used.
# Country keys as in the world (German country names).

# share of the league's games a player needs for a league award; weight of goals per game in the player award
min_spiele_anteil = 0.5
tor_gewicht = 0.8

standard = [
  { id = "spieler", art = "spieler" },
  { id = "tore", art = "tore" },
  { id = "jung", art = "jung", alter = 21 },
  { id = "torwart", art = "torwart" },
  { id = "trainer", art = "trainer" },
]

# Award calendar (days of the season, day 0 = 1 August): Ballon d'Or nominees 8 Sep, night 26 Oct;
# The Best shortlist 6 Nov, night 16 Dec (France Football / FIFA 2025-26)
[termine]
ballon_nominierung = 38
ballon_gala = 86
best_shortlist = 97
best_gala = 137

