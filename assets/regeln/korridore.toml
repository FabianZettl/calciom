# Korridore der Transfer-KI (docs/intern/TRANSFER-KI.md, Fabian 24.11.). Alle Zahlen Startwerte, änderbar.

[stufen]
# Ligastärke (Mittel der Vereinsstärken) → Stufe A–D: ab a = A, ab b = B, ab c = C, sonst D
a = 74
b = 68
c = 62

[gewicht]
# Stufenabstand (Ziel minus Herkunft, positiv = höher): Index = Abstand + 3, also −3 … +3
stufe = [0.0, 0.15, 0.6, 1.0, 0.8, 0.3, 0.05]
land_gleich = 1.0
kontinent_gleich = 0.7
kontinent_anders = 0.35
sprache = 1.2
strom = 1.4
geld = 1.5
geld_ab_alter = 28
mindestens = 0.05

[radius]
weltklasse_ab = 85
gut_ab = 78
alt_ab = 33

[strom]
# zusammengefasste Ligen: Wechsel je Team und Sommerfenster (Winter ein Drittel)
je_team = 1.2
winter = 0.33

