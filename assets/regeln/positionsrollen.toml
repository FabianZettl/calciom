# Scouting-Konzept 2.2 (23.11.2026): Wichtigkeit jedes FL27-Werts je Positionsgruppe. kern = entscheidet über die Position,
# rolle = zählt je nach Rolle, plus = Stärke, nie Schwäche, egal = wird nie genannt. Nicht genannte Werte zählen als plus.
# Namen wie entwicklung.rs NAMEN (flachpass = Low Pass, steilpass = Lofted Pass).
[gewicht]
kern = 3.0
rolle = 2.0
plus = 0.5
egal = 0.0
gelernt = -4.0       # Position nur gelernt (Positionsstufe 1)
fremd = -12.0        # Position gar nicht

[schwelle]
