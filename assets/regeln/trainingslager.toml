# Trainingslager (Punkt 14, Konzept Teil 4). Diese Datei darfst du ändern: Orte dazunehmen, umbenennen, löschen.
# art: sommer, winter, kurz, marketing · kosten_tag: je Person und Tag in Euro · reise_kosten: Reise hin und zurück für alle
# reisetage: Tage ohne Training (An- und Abreise) · zeit: Zeitverschiebung in Stunden (ab 4: Jetlag)
# plaetze und ruhe: 1–5 (Trainingsnutzen × 1 + 0,05 · (Plätze − 3) + 0,05 · (Ruhe − 3)) · klima: hoehe, warm, mild, kuehl, heiss
# marketing: 0–5 (nur Marketing-Reise: Antrittsgeld und Fans im Ausland) · prestige_ab: nur für Vereine ab dieser Größe (0–1)

[regeln]
stab = 15                    # mitreisende Betreuer und Trainer
eingespielt_tag = 0.9        # Eingespieltheit je Trainingstag bei Faktor 1
hoehe_faktor = 1.3           # Höhe: mehr Aufbau
teamgeist_basis = 2.0        # Teamgeist „Lager“: 2 + 0,5 je Tag, höchstens 7
teamgeist_je_tag = 0.5
teamgeist_max = 7.0
jetlag_ab = 4                # Stunden Zeitverschiebung
jetlag_kondition = 2.5       # je Tag in den ersten zwei Tagen nach der Ankunft
vorstand_knapp = 35          # Vorstandsvertrauen darunter: nur Lager bis zur Grenze
grenze_knapp = 120000
marketing_antritt = 900000   # Antrittsgeld je Marketing-Stufe
marketing_fans = 0.6         # Fanstimmung je Marketing-Stufe
marketing_eingespielt = 0.8  # Marketing-Reise: Eingespieltheit × 0,8

