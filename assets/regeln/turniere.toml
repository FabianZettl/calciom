# Turniere und Reisen der Vorbereitung (Punkt 14, Fabians Antworten 2 und 3). Diese Datei darfst du ändern:
# Einträge dazunehmen, umbenennen, löschen. echt = true heißt: das Turnier gibt es wirklich (Name wie im Fußball),
# echt = false heißt: erfunden. Keine Hallenturniere; kleine Turniere auf Reisen mit 2 bis 4 Mannschaften.
# region: wohin die Reise geht; tage: Länge der Reise; reise: Belastung der Anreise (Kondition, die die Spieler verlieren);
# kosten: was die Reise den Verein kostet; antritt: Antrittsgeld des Veranstalters; teams: Mannschaften im Turnier (mit uns).

