# Vorbereitung, Testspiele, Reisen, Teamevents, Urlaub (Punkt 14). Zahlen aus dem Konzept
# konzepte/vorbereitung-und-teamevents.md, wo es sie nennt; „CalcioM“ = eigene Startwerte.

[urlaub]
# Sommerpause: so viele Urlaubstage; je Tag verliert ein Spieler 0,6 × (1,3 − Professionalität) Kondition (Konzept 3.3)
tage = 28
verlust_je_tag = 0.6
# Übergewicht: Chance = basis + (1 − Professionalität) × je_unprofi; dann zusätzlich so viel Kondition weg und Moral −2 (CalcioM)
basis = 0.02
je_unprofi = 0.12
extra_verlust = 8.0
moral = -2.0

[testspiel]
# Belastung: +10 × Minuten / 90 (Konzept 2.5) als Kondition, die das Spiel kostet
belastung = 10.0
# Eingespieltheit je Testspiel und Moral für die, die spielen (Spielzeit-Treiber halb)
eingespielt = 0.6
moral_spielzeit = 0.5
# Zusage des Gegners: so wahrscheinlich bei gleicher Stärke, je Stärkepunkt, den er besser ist, weniger (CalcioM)
zusage = 0.9
zusage_je_punkt = 0.04
# Abstand zu Pflichtspielen in Tagen (Konzept 1.3): davor 2, danach 1
abstand_davor = 2
abstand_danach = 1

[anfragen]
# Anfragen anderer Vereine je Pause (Sommer, Winter, Länderspielpause): 3 bis 8, Frist 5 bis 10 Tage (Konzept 2.2);
# in einer Länderspielpause weniger (Faktor), die Anfragenden sind eher schwächer (Abstand in Stärkepunkten)
min = 2
max = 5
frist_min = 5
frist_max = 10
faktor_laenderspiel = 0.5
staerke_unter = 8.0
staerke_ueber = 3.0

[reise]
# Teamgeist „Lager“ für eine Reise (bis +7 im Konzept) und Eingespieltheit je Turnierspiel (CalcioM)
teamgeist = 4.0
eingespielt = 0.8

[teamgeist]
# Summand „events“ im Teamgeist: Halbwertszeit 30 Tage, höchstens ±8 (Konzept 5.1)
halbwertszeit = 30.0
deckel = 8.0

# Teamevents: Kosten, Teamgeist, Sperre bis zum nächsten Mal (Tage); skandal = Chance auf einen gemäßigten Skandal
# (Fabians Antwort 4: nur bei Mannschaftsabend und Abschlussfahrt, selten, mit Wirkung)
[[event]]
id = "grillabend"
kosten = 8000
teamgeist = 2.0
sperre = 21
skandal = 0.0

[[event]]
id = "kartbahn"
kosten = 15000
teamgeist = 3.0
sperre = 30
skandal = 0.0

[[event]]
id = "mannschaftsabend"
kosten = 25000
teamgeist = 4.0
sperre = 30
skandal = 0.06

[[event]]
id = "abschlussfahrt"
kosten = 180000
teamgeist = 6.0
sperre = 120
skandal = 0.10

[skandal]
# Wirkung eines Skandals: der Spieler (Moral), Medienbild, Fans, Vorstand; der Teamgeist-Gewinn des Abends halbiert sich
moral = -4.0
medien = -3.0
fans = -1.0
vorstand = -1.0

[grundfitness]
# Konzept 3.3: Startwert aus Alter und Professionalität; Urlaub −0,6 · (1,3 − Prof./100) je Tag (siehe [urlaub]);
# Aufbau je Trainingseinheit 0,04 · Basispunkte (über 85 die Hälfte); Testspiel +1,5 je 90 Minuten; im Lager je
# Trainingstag 0,6 × Lagerfaktor; in der Saison −0,05 je Tag ohne Ausdauerarbeit (frei, Regeneration)
start = 60.0
start_je_prof = 0.3
start_alter_ab = 30
start_je_jahr = 1.5
basis = [0, 0, 2, 5, 2, 8]   # Basispunkte je Einheit: frei, Regeneration, leicht, normal, Taktik, intensiv
je_basispunkt = 0.04
testspiel_je_90 = 1.5
lager_je_tag = 0.6
abbau_tag = 0.05
uebergewicht = 8.0
# Wirkung: Kondition höchstens 60 + 0,4 · Grundfitness; Verletzungsrisiko × (1 + (70 − Grundfitness)/100) unter 70
kondition_basis = 60.0
kondition_je_gf = 0.4
verletzung_unter = 70.0
# Leistungstest: genaue Werte mit guter Medizin/Fitness (Qualität ab), sonst Stufen; Soll für die Zeile des Co-Trainers
test_genau_ab = 60.0
soll = 70.0
topfit = 85.0
