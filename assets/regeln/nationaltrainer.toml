GER = ["Antonio Di Salvo"]
ENG = ["Lee Carsley"]
ESP = ["Santi Denia"]
ARG = []
KOR = []

# PES M: Regeln der Nominierung und der Länderspiele (Kern)
[pes_m]
pool_mindestens = 15          # so viele Spieler braucht eine Nation, um ein Team zu stellen
verletzt_bis = 5              # länger verletzt: nicht im Pool
fitness_je_spiel = 6.0
wert_je_spiel = 0.01          # Marktwert +1 % je Länderspiel (die ersten zehn)
verletzung_je_spiel = 0.006
zettel_abstand = 3.0
elo_fenster = 20.0            # FIFA-Punkte: Gewicht eines Freundschaftsspiels
elo_turnier = 50.0            # … eines Turnierspiels
turnier_starttag = 10         # Turniere beginnen am 10. ihres ersten Monats
turnier_schub = [1.03, 1.06, 1.10, 1.15, 1.20, 1.30]   # Marktwert nach Turnier: Gruppe, Achtel-, Viertel-, Halbfinale, Finale, Sieg
wissen_nach_turnier = 45      # wer bei einem Turnier war, ist danach bekannt          # „Auf dem Zettel“: höchstens so weit unter dem schwächsten Nominierten seiner Mannschaftsteils

