# Look der Wettbewerbe in PES M (Wettbewerbsseiten): Farben wie die echten Ligen, Muster (sterne, streifen, keins).
# Schlüssel = Wettbewerbsschlüssel der Welt (z. B. ENGLAND_D1_LEAGUE) oder Art (cl, el, uecl). Ohne Eintrag: die Farben des Landes.
# farbe1 = Grund des Banners, farbe2 = zweite Farbe (Verlauf, Kanten), akzent = Linien und Zonen. Diese Datei darfst du ändern.

[art.cl]
farbe1 = "0b1b4d"
farbe2 = "1e3a8a"
akzent = "c0c8d8"
muster = "sterne"
[art.el]
farbe1 = "1a1a1a"
farbe2 = "f26522"
akzent = "f26522"
muster = "streifen"
[art.uecl]
farbe1 = "0b2a1c"
farbe2 = "00be46"
akzent = "00be46"
muster = "streifen"

