[package]
name = "pesm"
version = "0.1.0"
edition = "2021"
default-run = "pesm"

[dependencies]
# macroquad's own image crate, with its DDS reader (DXT1/3/5) switched on for player photos and crests
image = { version = "0.24", default-features = false, features = ["png", "tga", "dds"] }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.11"
toml = "0.8"
# Punkt 4: the Coaching Zone as a library (memory reader, live tracker); read only, its folder is never changed
pesm-coaching-zone = { git = "https://github.com/FabianZettl/pesm-coaching-zone", rev = "74c069f" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
